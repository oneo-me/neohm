name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, and the uploads to it

concurrency:
  group: release-${{ github.ref }}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          version="$(jq -r .version source/mygo.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version in source/mygo.json"
            exit 1
          fi

      # The section "## [1.2.0] - 2026-10-20" (or "## 1.2.0") of the version,
      # which mygo build also puts in the update manifests.
      - name: Extract the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / {
              if (found) exit
              h = $2; sub(/^\[/, "", h); sub(/\].*$/, "", h); sub(/^v/, "", h)
              found = (h == v)
              next
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no notes for $version: rename [Unreleased] to [$version] - $(date -u +%F)"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "NeoHM ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 26 compiles the Liquid Glass icon; signing and disk images need macOS.
          - { name: macOS, os: macos-26, platform: "darwin/universal" }
          # MyGo needs no cgo, so Linux cross-compiles the Windows apps.
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Test
        if: matrix.name == 'macOS'
        working-directory: source
        run: go test ./...

      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      # Without the key, mygo build skips the update manifests, and installed
      # apps would never see this release.
      - name: Check the update signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::Add the MYGO_UPDATER_PRIVATE_KEY secret, the contents of mygo-update.key"
            exit 1
          fi

      # Signed ad hoc on macOS and unsigned on Windows, without notarization.
      - name: Build and upload
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
