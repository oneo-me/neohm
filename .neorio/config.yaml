icon: source/icons/AppIcon.png
tasks:
  - label: Run
    group: run
    command: go
    args: [tool, mygo, dev]
    options:
      cwd: source
  - label: Build
    group: build
    command: go
    args: [tool, mygo, build]
    options:
      cwd: source
    outputDirectory: ../dist
  - label: Website
    type: shell
    command: bun install && bun run dev
    options:
      cwd: website
